<style>
:root{--ink:#3b3226;--paper:#fffaf0;--leaf:#6cc17a;--leaf-d:#3f9a5a;--sun:#ffd166;--pink:#ff8fab;--sky:#8fd3ff;--line:#e8dcc2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;font-family:'Gowun Dodum','Jua',system-ui,sans-serif;color:var(--ink)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
.btn{font:inherit;font-family:'Jua',sans-serif;background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:.55em 1.2em;font-size:1rem;cursor:pointer;box-shadow:0 3px 0 var(--leaf-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.pink{background:var(--pink);box-shadow:0 3px 0 #e0658a}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #d9a82e}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hud{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:rgba(255,250,240,.93);border:2px solid var(--line);border-radius:18px;padding:8px 14px;box-shadow:0 3px 8px rgba(0,0,0,.12);font-size:.95rem}
.pill b{font-family:'Jua';font-weight:400}
#quest{max-width:290px;line-height:1.35}
#quest .t{color:var(--leaf-d);font-family:'Jua'}
.topbtns{position:fixed;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.help{position:fixed;left:12px;bottom:12px;font-size:.8rem;background:rgba(255,250,240,.8);padding:6px 10px;border-radius:12px;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);display:none;font-size:1.1rem;padding:.6em 1.4em;white-space:nowrap}
#prompt kbd{background:#fff;color:var(--ink);border-radius:6px;padding:1px 7px;margin-right:6px;font-family:inherit}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#3b3226;color:#fff;border-radius:999px;padding:8px 18px;animation:tin .25s,tout .4s 2.6s forwards;font-size:.95rem}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#fade{position:fixed;inset:0;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:auto}
#dialog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,94vw);background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:16px 20px 14px;display:none;box-shadow:0 6px 0 rgba(0,0,0,.18)}
#dialog .nm{position:absolute;top:-18px;left:18px;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-family:'Jua';font-size:1.05rem}
#dialog .tx{font-size:1.1rem;line-height:1.55;min-height:3.1em;white-space:pre-wrap}
#dialog .ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#dialog .nx{text-align:right;font-size:.8rem;opacity:.6}
.modal-back{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.modal{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:22px 24px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.modal.wide{width:min(900px,100%)}
.modal h2{margin:0 0 10px;font-size:1.5rem}
.modal .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:1.3rem;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.1rem}
.card p{margin:0;font-size:.88rem;line-height:1.4}
.spine{height:10px;border-radius:5px}
.tag{display:inline-block;background:#e9f6e5;color:var(--leaf-d);border-radius:999px;padding:1px 9px;font-size:.82rem;margin:2px 3px 2px 0}
.tag.btnlike{cursor:pointer;border:0;font-family:inherit}
.tag.on{background:var(--leaf);color:#fff}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.opt{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;font:inherit;font-size:.88rem}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea,input[type=text]{font:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.bar{height:16px;border-radius:99px;background:#eadfc6;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);transition:width .2s}
.bar.low>i{background:#ee6c4d}
.center{text-align:center}
.mut{opacity:.65;font-size:.88rem}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
tr.me{background:#fff3c4;font-weight:bold}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.key{display:inline-block;width:46px;height:150px;background:#fff;border:2px solid var(--ink);border-radius:0 0 10px 10px;margin:0 2px;cursor:pointer;vertical-align:top;position:relative;font-size:.8rem}
.key span{position:absolute;bottom:6px;left:0;right:0;text-align:center}
.key.down{background:var(--sun)}
.bookpage{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
.creator{position:fixed;left:12px;top:12px;bottom:12px;width:min(380px,92vw);overflow:auto;background:rgba(255,250,240,.96);border:3px solid var(--ink);border-radius:24px;padding:18px}
.creator h3{margin:14px 0 6px;font-size:1rem}
.title-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(#bfe8ff 0%,#e9f9d8 100%);text-align:center}
.title-screen h1{font-size:clamp(2.4rem,8vw,4.6rem);margin:0;color:#2f7d4a;text-shadow:0 4px 0 #fff}
.title-screen p{max-width:520px;margin:0;line-height:1.6}
@media(max-width:640px){.help{display:none}#quest{max-width:200px;font-size:.85rem}}
</style>
</head>

<div id="ui">
  <div class="hud" id="hud" style="display:none">
    <div class="pill" id="me"></div>
    <div class="pill" id="quest"></div>

  <div id="dialog"><div class="nm"></div><div class="tx"></div><div class="ch"></div><div class="nx">▶ 클릭 또는 E</div></div>
  <div id="screen"></div>
  <div id="fade"></div>
</div>

   3D 아바타 (AvatarFigure.tsx 의 SVG 캐릭터 → 3D 캐릭터)

function buildAvatar(cfg){
  const g=new THREE.Group();const dark='#2b2b2b';
  const skin=mat(cfg.skin),hair=mat(cfg.hair),top=mat(cfg.top),bot=mat(cfg.bottom);
  const A={group:g};
  // 다리
  const legH=0.5,shorts=cfg.bottomStyle==='shorts',skirt=cfg.bottomStyle==='skirt';
  const mkLeg=(sx)=>{const p=new THREE.Group();p.position.set(sx*0.14,0.5,0);
    const upperLen=shorts?0.22:skirt?0.0:legH;
    if(upperLen>0)cyl(p,0.1,0.095,upperLen,bot,0,-upperLen/2,0,12);
    if(upperLen<legH)cyl(p,0.085,0.08,legH-upperLen,skin,0,-upperLen-(legH-upperLen)/2,0,12);
    sph(p,0.11,'#4a3b32',0,-legH+0.04,0.04,1,0.6,1.3);g.add(p);return p};
  A.legL=mkLeg(-1);A.legR=mkLeg(1);
  // 몸통
  const body=new THREE.Group();g.add(body);A.body=body;
  cyl(body,0.27,0.3,0.62,top,0,0.82,0,20);
  sph(body,0.27,top,0,1.12,0,1,0.45,0.9);
  if(skirt){cyl(body,0.3,0.46,0.3,bot,0,0.52,0,20)}
  if(cfg.topStyle==='hoodie'){sph(body,0.2,top,0,1.14,-0.2,1.2,0.8,0.8);box(body,0.22,0.16,0.02,shadeC(cfg.top,-25),0,0.66,0.3)}
  if(cfg.topStyle==='uniform'){box(body,0.34,0.07,0.1,'#f7f5ef',0,1.1,0.25);box(body,0.07,0.28,0.03,'#e2574c',0,0.95,0.3)}
  if(cfg.topStyle==='stripe'){for(let i=0;i<3;i++){const t=new THREE.Mesh(new THREE.CylinderGeometry(0.285+i*0.01,0.285+i*0.01,0.07,20),mat('#f7f5ef'));t.position.set(0,0.65+i*0.17,0);body.add(t)}}
  if(cfg.topStyle==='overall'){box(body,0.34,0.3,0.05,bot,0,0.78,0.27);box(body,0.06,0.3,0.05,bot,-0.14,1.0,0.25);box(body,0.06,0.3,0.05,bot,0.14,1.0,0.25)}
  // 팔
  const mkArm=(sx)=>{const p=new THREE.Group();p.position.set(sx*0.36,1.08,0);
    mesh(new THREE.CapsuleGeometry(0.08,0.34,4,10),skin,0,-0.2,0,p);cyl(p,0.092,0.092,0.14,top,0,-0.05,0,12);g.add(p);return p};
  A.armL=mkArm(-1);A.armR=mkArm(1);
  // 머리
  const head=new THREE.Group();head.position.y=1.55;g.add(head);A.head=head;
  sph(head,0.42,skin,0,0,0,1,0.96,1);
  // 볼터치
  [-1,1].forEach(s=>sph(head,0.06,'#ff9fb0',s*0.26,-0.08,0.33,1,0.6,0.4));
  // 눈
  const eyeY=0.03,eyeX=0.15,eyeZ=0.385;
  const arc=(x,y,z,r,t,flip)=>{const m=mesh(new THREE.TorusGeometry(r,t,6,14,Math.PI),dark,x,y,z,head);if(flip)m.rotation.z=Math.PI;m.castShadow=false};
  [-1,1].forEach(s=>{
    const wink=cfg.face==='wink'&&s===-1;
    if(cfg.eyes==='happy'||wink)arc(s*eyeX,eyeY-0.015,eyeZ,0.05,0.014,false);
    else{const r=cfg.eyes==='sparkle'?0.065:0.05;sph(head,r,dark,s*eyeX,eyeY,eyeZ,1,1.15,0.5);
      if(cfg.eyes==='sparkle')sph(head,0.02,'#fff',s*eyeX+0.02,eyeY+0.03,eyeZ+0.03)}
  });
  // 입
  const mz=0.405,my=-0.13;
  if(cfg.face==='smile'||cfg.face==='wink')arc(0,my+0.035,mz,0.06,0.013,true);
  else if(cfg.face==='cheerful'){const m=mesh(new THREE.SphereGeometry(0.075,12,8,0,Math.PI*2,Math.PI/2,Math.PI/2),'#b83d52',0,my+0.03,mz-0.01,head);m.rotation.x=-0.2;m.castShadow=false}
  else if(cfg.face==='wow')sph(head,0.04,dark,0,my,mz,1,1.2,0.5);
  else if(cfg.face==='calm')box(head,0.1,0.014,0.01,dark,0,my,mz);
  // 머리카락
  const cap=(r=0.465,tilt=-0.32,frac=0.55)=>{const m=mesh(new THREE.SphereGeometry(r,24,16,0,Math.PI*2,0,Math.PI*frac),hair,0,0,0,head);m.rotation.x=tilt;m.scale.y=0.98;return m};
  const hs=cfg.hairStyle;
  if(hs==='short'){cap()}
  else if(hs==='long'){cap();box(head,0.86,0.9,0.2,hair,0,-0.28,-0.3);sph(head,0.1,hair,0.4,-0.5,-0.1);sph(head,0.1,hair,-0.4,-0.5,-0.1)}
  else if(hs==='curly'){cap(0.45,-0.3,0.5);for(let i=0;i<10;i++){const a=i/10*Math.PI*2;sph(head,0.14,hair,Math.sin(a)*0.36,0.28+(i%2)*0.04,Math.cos(a)*0.36-0.04)}sph(head,0.18,hair,0,0.45,-0.05)}
  else if(hs==='cap'){cap(0.47,-0.2,0.5);const b=box(head,0.56,0.04,0.34,hair,0,0.2,0.42);b.rotation.x=0.18}
  else if(hs==='wave'){cap();[-1,1].forEach(s=>{sph(head,0.16,hair,s*0.4,-0.12,-0.05,1,1.6,1);sph(head,0.12,hair,s*0.38,-0.38,0.0)})}
  else if(hs==='bob'){cap(0.47,-0.28,0.58);sph(head,0.46,hair,0,-0.12,-0.12,1,0.8,0.9);[-1,1].forEach(s=>box(head,0.09,0.3,0.42,hair,s*0.4,-0.12,0.0))}
  else if(hs==='ponytail'){cap();sph(head,0.14,hair,0,0.1,-0.5,1,1,1);sph(head,0.12,hair,0,-0.15,-0.56,1,2.4,1)}
  else if(hs==='bun'){cap();sph(head,0.19,hair,0,0.48,-0.05)}
  else if(hs==='spiky'){cap(0.45,-0.2,0.45);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const c=mesh(new THREE.ConeGeometry(0.1,0.3,8),hair,Math.sin(a)*0.3,0.42,Math.cos(a)*0.3,head);c.rotation.z=-Math.sin(a)*0.5;c.rotation.x=Math.cos(a)*0.5}}
  // 장신구
  const ac=cfg.accessory;
  if(ac==='glasses'||ac==='sunglasses'){[-1,1].forEach(s=>{
    if(ac==='glasses'){const m=mesh(new THREE.TorusGeometry(0.1,0.015,6,16),'#263746',s*eyeX,eyeY,eyeZ+0.02,head);m.castShadow=false}
    else{const m=mesh(new THREE.CylinderGeometry(0.105,0.105,0.03,16),'#1f2b36',s*eyeX,eyeY,eyeZ+0.02,head);m.rotation.x=Math.PI/2;m.castShadow=false}});
    box(head,0.1,0.015,0.015,'#263746',0,eyeY,eyeZ+0.03)}
  if(ac==='headband'){const m=mesh(new THREE.TorusGeometry(0.44,0.035,8,28),'#e2574c',0,0.12,-0.02,head);m.rotation.x=Math.PI/2-0.25;m.scale.set(1,1,1)}
  if(ac==='bow'){const b=new THREE.Group();b.position.set(0.28,0.4,0.18);head.add(b);
    [-1,1].forEach(s=>{const c=mesh(new THREE.ConeGeometry(0.1,0.18,8),'#d15a9a',s*0.1,0,0,b);c.rotation.z=s*-Math.PI/2});sph(b,0.05,'#b03f7e',0,0,0)}
  if(ac==='beanie'){const m=mesh(new THREE.SphereGeometry(0.5,22,14,0,Math.PI*2,0,Math.PI*0.5),'#f2a33c',0,0.02,0,head);m.rotation.x=-0.2;sph(head,0.09,'#fff',0,0.55,-0.1)}
  A.mats={skin,hair,top,bot};
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  A.animate=(t,amt)=>{
    const s=Math.sin(t*11)*0.9*amt;
    A.legL.rotation.x=s;A.legR.rotation.x=-s;A.armL.rotation.x=-s*0.9;A.armR.rotation.x=s*0.9;
    g.position.y=Math.abs(Math.sin(t*11))*0.08*amt;
    body.rotation.z=Math.sin(t*5.5)*0.04*amt;
    head.rotation.z=Math.sin(t*5.5)*0.05*amt;
    const idle=Math.sin(t*2)*0.012*(1-amt);body.scale.y=1+idle;
  };
  return A;
}
function shadeC(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return '#'+((f((n>>16)&255)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).padStart(6,'0')}

function newWorld(opts){return {group:new THREE.Group(),colliders:[],interacts:[],npcs:[],tick:[],bounds:opts.bounds,cam:opts.cam||[0,12,11],sky:opts.sky||'#bfe8ff',spawn:opts.spawn||[0,0],name:opts.name,speedy:[]}}
function addNPC(w,{cfg,x,z,name,lines,wander=true,label,onTalk,range=6,home}){
  const av=buildAvatar(cfg);const g=av.group;g.position.set(x,0,z);
  const lb=labelSprite(label||name);lb.position.y=2.55;g.add(lb);w.group.add(g);
  const n={av,g,name,state:{tx:x,tz:z,wait:Math.random()*2,talking:false},wander,range,home:home||[x,z],lines};
  w.npcs.push(n);
  w.interacts.push({obj:g,r:2.4,label:`${name}에게 말 걸기`,fn:async()=>{
    n.state.talking=true;const d=new THREE.Vector3().subVectors(player.group.position,g.position);g.rotation.y=Math.atan2(d.x,d.z);
    try{ if(onTalk)await onTalk(n); else await say(name,rndPick(lines)); }finally{n.state.talking=false}}});
  return n;
}
function updateNPCs(dt,w){
  for(const n of w.npcs){const s=n.state,p=n.g.position;let moving=false;
    if(n.wander&&!s.talking){
      if(s.wait>0){s.wait-=dt}
      else{const dx=s.tx-p.x,dz=s.tz-p.z,d=Math.hypot(dx,dz);
        if(d<0.3){s.wait=1.5+Math.random()*3;const a=Math.random()*Math.PI*2,r=Math.random()*n.range;s.tx=n.home[0]+Math.cos(a)*r;s.tz=n.home[1]+Math.sin(a)*r;if(!inBounds(w,s.tx,s.tz)){s.tx=n.home[0];s.tz=n.home[1]}}
        else{const sp=2.2*dt;p.x+=dx/d*sp;p.z+=dz/d*sp;n.g.rotation.y=Math.atan2(dx,dz);moving=true}}
    }
    n.av.animate(T+n.home[0],moving?1:0);
  }
}
function inBounds(w,x,z){const b=w.bounds;if(b.r)return Math.hypot(x,z)<b.r-0.5;return x>b.x1&&x<b.x2&&z>b.z1&&z<b.z2}
function collide(w,p,r=0.45){
  for(const c of w.colliders){
    if(c.r!==undefined){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+r;if(d<m&&d>0.0001){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m}}
    else{const nx=Math.max(c.x1,Math.min(p.x,c.x2)),nz=Math.max(c.z1,Math.min(p.z,c.z2));const dx=p.x-nx,dz=p.z-nz,d=Math.hypot(dx,dz);
      if(d<r){if(d>0.0001){p.x=nx+dx/d*r;p.z=nz+dz/d*r}else{const l=p.x-c.x1,rr=c.x2-p.x,t=p.z-c.z1,b=c.z2-p.z,m=Math.min(l,rr,t,b);if(m===l)p.x=c.x1-r;else if(m===rr)p.x=c.x2+r;else if(m===t)p.z=c.z1-r;else p.z=c.z2+r}}}
  }
  const b=w.bounds;
  if(b.r){const d=Math.hypot(p.x,p.z);if(d>b.r-1){p.x*=(b.r-1)/d;p.z*=(b.r-1)/d}}
  else{p.x=Math.max(b.x1+0.6,Math.min(b.x2-0.6,p.x));p.z=Math.max(b.z1+0.6,Math.min(b.z2-0.6,p.z))}
}

async function goScene(name,spawn){

  cur=SCENES[name]();scene.add(cur.group);

  const sp=spawn||cur.spawn;player.group.position.set(sp[0],0,sp[1]);player.target=null;

function tree(w,x,z,s=1,c1='#5fb36a',fruit){
  const g=new THREE.Group();g.position.set(x,0,z);
  cyl(g,0.22*s,0.3*s,1.8*s,'#8b5e3c',0,0.9*s,0,8);
  sph(g,1.35*s,c1,0,2.6*s,0,1,0.95,1);sph(g,0.95*s,shadeC(c1,12),0.6*s,3.2*s,0.2*s);sph(g,0.8*s,shadeC(c1,-10),-0.7*s,2.9*s,-0.3*s);
  if(fruit){for(let i=0;i<5;i++){const a=i*1.3;sph(g,0.12*s,fruit,Math.cos(a)*1.1*s,2.3*s+Math.sin(i*2)*0.4*s,Math.sin(a)*1.1*s)}}
  w.group.add(g);w.colliders.push({x,z,r:0.5*s});return g;
}
function flowers(w,n,rad,cx=0,cz=0,skipR=0){
  const cols=['#ff8fab','#ffd166','#fff','#c9a7ff','#ff9f68'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=skipR+Math.random()*(rad-skipR);const x=cx+Math.cos(a)*r,z=cz+Math.sin(a)*r;
    cyl(w.group,0.02,0.02,0.25,'#4fa05a',x,0.12,z,4);sph(w.group,0.1,rndPick(cols),x,0.3,z,1,0.6,1).castShadow=false}
}
function building(w,{x,z,bw,bd,bh,color,roof,sign,door=true}){
  const g=new THREE.Group();g.position.set(x,0,z);w.group.add(g);
  box(g,bw,bh,bd,color,0,bh/2,0);
  box(g,bw+0.5,0.35,bd+0.5,shadeC(color,-30),0,0.17,0);
  const r=mesh(new THREE.ConeGeometry(bw*0.78,2.6,4),roof,0,bh+1.3,0,g);r.rotation.y=Math.PI/4;r.scale.z=bd/bw;
  for(const bx of [-0.5,-0.25,0,0.25,0.5])box(g,0.22,bh,0.12,'#7a4f2d',bx*bw,bh/2,bd/2+0.03);box(g,bw,0.22,0.14,'#7a4f2d',0,bh*0.55,bd/2+0.04);
  for(const sx of [-1,1]){cyl(g,1.5,1.5,bh+1.2,color,sx*(bw/2+0.4),(bh+1.2)/2,bd/2-0.2,20);mesh(new THREE.ConeGeometry(1.9,2.4,20),roof,sx*(bw/2+0.4),bh+2.4,bd/2-0.2,g)}
  // 창문
  for(const sx of [-1,1]){for(const yy of [bh*0.35,bh*0.72]){box(g,1.3,1.2,0.15,'#ffffff',sx*bw*0.3,yy,bd/2+0.02);box(g,1.1,1.0,0.17,'#9bd8f5',sx*bw*0.3,yy,bd/2+0.03)}}
  if(door){box(g,1.8,2.7,0.2,'#7a5233',0,1.4,bd/2+0.05);box(g,2.2,0.2,0.4,'#fff',0,2.85,bd/2+0.15);sph(g,0.08,'#ffd166',0.55,1.4,bd/2+0.2)}
  const sp=labelSprite(sign,{size:36});sp.position.set(0,bh+3.4,bd/2);sp.scale.multiplyScalar(1.6);g.add(sp);
  w.colliders.push({x1:x-bw/2,x2:x+bw/2,z1:z-bd/2,z2:z+bd/2});
  return g;
}

/* ===== 방(실내) 공통 ===== */
function makeRoom(name,{W,D,floor,wall,sky='#fff1d6',deco}){
  const w=newWorld({name,bounds:{x1:-W/2,x2:W/2,z1:-D/2,z2:D/2},cam:[0,10.5,9.5],sky,spawn:[0,D/2-2]});
  const g=w.group;
  const fl=mesh(new THREE.BoxGeometry(W,0.3,D),floor,0,-0.15,0,g);fl.castShadow=false;
  box(g,W+0.6,6,0.3,wall,0,3,-D/2-0.15);box(g,0.3,6,D,wall,-W/2-0.15,3,0);box(g,0.3,6,D,wall,W/2+0.15,3,0);
  box(g,W,0.35,0.2,shadeC(wall,-30),0,0.17,-D/2+0.1);
  // 창문
  for(const x of [-W*0.28,W*0.28]){box(g,2.4,2.2,0.15,'#fff',x,3.3,-D/2+0.05);box(g,2.1,1.9,0.17,'#a9defa',x,3.3,-D/2+0.07)}
  // 출입 매트 + 나가기
  box(g,3,0.06,1.5,'#d9a46a',0,0.03,D/2-1.0).castShadow=false;
  const ex=emojiSprite('🚪',1.2);ex.position.set(0,1.3,D/2-1);g.add(ex);
  w.interacts.push({x:0,z:D/2-0.9,r:1.8,label:'밖으로 나가기',fn:()=>exitRoom()});
  return w;
}
async function exitRoom(){await goScene('campus',cur.exitTo||[0,-8])}

function shelf(g,x,z,books=36,w=2.6,h=3.4,rot=0,colors){
  const s=new THREE.Group();s.position.set(x,0,z);s.rotation.y=rot;g.add(s);
  box(s,w,h,0.7,'#a9764a',0,h/2,0);box(s,w-0.2,h-0.2,0.5,'#6e4a2c',0,h/2,0.12);
  const rows=4,per=Math.round(books/rows);
  for(let r=0;r<rows;r++){box(s,w-0.1,0.08,0.7,'#a9764a',0,0.4+r*(h-0.5)/rows,0);
    let xx=-w/2+0.2;for(let i=0;i<per;i++){const bw=0.14+Math.random()*0.12,bh=0.55+Math.random()*0.18,c=colors?rndPick(colors):rndPick(['#e2574c','#4aa3d8','#f2a33c','#7ac17a','#8a6fd1','#d15a9a','#f2d85c']);
      if(xx+bw>w/2-0.15)break;box(s,bw,bh,0.4,c,xx+bw/2,0.45+r*(h-0.5)/rows+bh/2,0.2);xx+=bw+0.02}}
  return s;
}

/* ============================================================
   게임 UI: 대화 · 모달 · 토스트 · HUD
   ============================================================ */
const $=s=>document.querySelector(s);
const dlg=$('#dialog'),promptBtn=$('#prompt');
let dlgResolve=null,dlgChoices=false;
function say(name,text){return new Promise(res=>{uiLock++;dlg.style.display='block';dlg.querySelector('.nm').textContent=name;dlg.querySelector('.tx').textContent=text.replace(/\{name\}/g,S?.avatar.displayName||'나');
  dlg.querySelector('.ch').innerHTML='';dlg.querySelector('.nx').style.display='';dlgChoices=false;dlgResolve=()=>{dlg.style.display='none';uiLock--;dlgResolve=null;res()}})}
function choose(name,text,opts){return new Promise(res=>{uiLock++;dlg.style.display='block';dlg.querySelector('.nm').textContent=name;dlg.querySelector('.tx').textContent=text.replace(/\{name\}/g,S?.avatar.displayName||'나');
  const ch=dlg.querySelector('.ch');ch.innerHTML='';dlg.querySelector('.nx').style.display='none';dlgChoices=true;dlgResolve=null;
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='btn alt';b.textContent=o;b.onclick=e=>{e.stopPropagation();dlg.style.display='none';uiLock--;dlgChoices=false;res(i)};ch.appendChild(b)})})}
dlg.addEventListener('click',()=>{if(dlgResolve&&!dlgChoices)dlgResolve()});

let modalEl=null,modalClose=null;
function openModal(html,{cls='',onClose}={}){closeModal(true);uiLock++;
  const m=document.createElement('div');m.className='modal-back';m.innerHTML=`<div class="modal ${cls}"><button class="x" aria-label="닫기">✕</button>${html}</div>`;
  $('#ui').appendChild(m);modalEl=m;modalClose=onClose;
  m.querySelector('.x').onclick=()=>closeModal();m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});
  return m.querySelector('.modal')}
function closeModal(silent){if(!modalEl)return;modalEl.remove();modalEl=null;uiLock--;const f=modalClose;modalClose=null;if(f&&!silent)f()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3100)}
function refreshHud(){
  if(!S)return;const t=tierOf(myScore());
  $('#me').innerHTML=`<b>${S.avatar.displayName||'나'}</b> · 💰 ${S.points}P · ${t.e} ${t.n} · 📚 ${completedCount()}권`;
  const bs=Object.entries(S.books);let q;
  if(!bs.length)q=['도서관에서 책 고르기','🏫 캠퍼스 위쪽 <b>도서관</b>에 가서 헤르만 헤세 사서님을 만나요.'];
  else{const nw=bs.find(([,b])=>b.status!=='reviewed');
    if(nw)q=['독서 활동 하기',`🏫 <b>우리 반 교실</b> 학급 문고에서 『${BOOKS[nw[0]].title}』 활동을 시작해요.`];
    else if(bs.some(([,b])=>!b.cover))q=['표지 만들기','🎨 <b>미술실</b>에서 AI로 나만의 책 표지를 만들어요. (+20P)'];
    else q=['다음 책 고르기','📚 도서관에서 새 책을 추천받거나, 상점에서 사물함을 꾸며 보세요!']}
  $('#quest').innerHTML=`<div class="t">📌 ${q[0]}</div>${q[1]}`;
}

/* ===== 입력 ===== */
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const k=e.key.toLowerCase();
  if(dlg.style.display==='block'){if(['e',' ','enter'].includes(k)&&dlgResolve&&!dlgChoices){e.preventDefault();dlgResolve()}return}
  if(k==='escape'){closeModal();return}
  if(modalEl){pianoKey(k,true);return}
  keys[k]=true;
  if((k==='e'||k===' '||k==='enter')&&!e.repeat){e.preventDefault();doInteract()}
  if(k.startsWith('arrow')||k===' ')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(modalEl)pianoKey(e.key.toLowerCase(),false)});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
canvas.addEventListener('wheel',e=>{zoom=Math.max(0.55,Math.min(1.7,zoom+Math.sign(e.deltaY)*0.08))},{passive:true});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
canvas.addEventListener('pointerdown',e=>{
  if(!cur||cur.creator||uiLock>0||e.button!==0)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)){
    // 근처 상호작용 지점을 직접 누르면 상호작용
    const hit=cur.interacts.find(it=>{const q=ipos(it);return Math.hypot(q.x-p.x,q.z-p.z)<1.4&&Math.hypot(q.x-player.group.position.x,q.z-player.group.position.z)<it.r+0.5});
    if(hit){hit.fn();return}
    player.target=p;}
});
promptBtn.addEventListener('click',()=>doInteract());
const ipos=it=>it.obj?{x:it.obj.position.x,z:it.obj.position.z}:{x:it.x,z:it.z};
let nearest=null;
function doInteract(){if(nearest&&uiLock===0)nearest.fn()}

/* ============================================================
   업데이트 루프
   ============================================================ */
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function snapCamera(){if(!cur||cur.creator)return;const p=player.group.position;const o=cur.cam;camPos.set(p.x+o[0]*zoom,o[1]*zoom,p.z+o[2]*zoom);camLook.set(p.x,1,p.z);camera.position.copy(camPos);camera.lookAt(camLook)}
function update(dt){
  T+=dt;
  if(!cur){return}
  if(cur.creator){
    camera.position.set(0,2.4,6.2);camera.lookAt(0,1.2,0);
    if(player.av){player.group.position.set(1.6,0,0);player.group.rotation.y+=dt*0.8;player.av.animate(T,0)}
    sun.position.set(6,12,8);sun.target.position.set(0,0,0);
    return;
  }
  // 이동
  let mx=0,mz=0;
  if(uiLock===0){
    if(keys['w']||keys['arrowup'])mz-=1;if(keys['s']||keys['arrowdown'])mz+=1;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
    if(mx||mz){player.target=null}
    else if(player.target){const dx=player.target.x-player.group.position.x,dz=player.target.z-player.group.position.z,d=Math.hypot(dx,dz);if(d<0.25)player.target=null;else{mx=dx/d;mz=dz/d}}
  }
  const moving=!!(mx||mz);
  if(moving){const l=Math.hypot(mx,mz);mx/=l;mz/=l;const p=player.group.position;
    const sp=player.speed*dt*(keys['shift']?1.5:1);const px=p.x,pz=p.z;
    p.x+=mx*sp;p.z+=mz*sp;collide(cur,p);
    if(player.target&&Math.hypot(p.x-px-mx*sp,p.z-pz-mz*sp)>0.2*sp+0.01&&Math.hypot(p.x-px,p.z-pz)<sp*0.3)player.target=null;
    const ta=Math.atan2(mx,mz);let da=ta-player.facing;da=Math.atan2(Math.sin(da),Math.cos(da));player.facing+=da*Math.min(1,dt*14);player.group.rotation.y=player.facing}
  player.av.animate(T,moving?1:0);
  updateNPCs(dt,cur);cur.tick.forEach(f=>f(dt));
  // 상호작용 탐색
  let best=null,bd=1e9;const pp=player.group.position;
  for(const it of cur.interacts){const q=ipos(it),d=Math.hypot(q.x-pp.x,q.z-pp.z);if(d<it.r&&d<bd){bd=d;best=it}}
  nearest=uiLock>0?null:best;
  if(nearest){promptBtn.style.display='block';promptBtn.innerHTML=`<kbd>E</kbd>${nearest.label}`}else promptBtn.style.display='none';
  // 카메라
  const o=cur.cam;const tx=pp.x+o[0]*zoom,ty=o[1]*zoom,tz=pp.z+o[2]*zoom;
  const k=1-Math.pow(0.001,dt);camPos.x+=(tx-camPos.x)*k;camPos.y+=(ty-camPos.y)*k;camPos.z+=(tz-camPos.z)*k;
  camLook.x+=(pp.x-camLook.x)*k;camLook.z+=(pp.z-camLook.z)*k;camLook.y=1.1;
  camera.position.copy(camPos);camera.lookAt(camLook);
  sun.position.set(pp.x+14,pp.y+26,pp.z+10);sun.target.position.copy(pp);
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),0.05);update(dt);renderer.render(scene,camera)}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function leagueData(scope){
  const n={class:9,grade:24,school:60}[scope];const r=rng({class:11,grade:22,school:33}[scope]);
  const rows=[];for(let i=0;i<n-1;i++){const nm=NAMES[Math.floor(r()*NAMES.length)];const gr=scope==='class'?'우리 반':scope==='grade'?`${1+Math.floor(r()*5)}반`:`${3+Math.floor(r()*3)}학년 ${1+Math.floor(r()*5)}반`;
    rows.push({name:nm,where:gr,score:Math.floor(r()*r()*660)})}
  rows.push({name:S.avatar.displayName||'나',where:'우리 반',score:myScore(),me:true});
  rows.sort((a,b)=>b.score-a.score);return rows;
}

/* ============================================================

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function drawCover(cv,{title,author,prompt,style}){
  const W=600,H=800;cv.width=W;cv.height=H;const out=cv.getContext('2d');
  const px=style==='pixel';const sc=px?0.2:1;
  const a=document.createElement('canvas');a.width=Math.round(W*sc);a.height=Math.round(H*sc);const c=a.getContext('2d');c.scale(sc,sc);
  const r=rng(hash(prompt+style));
  const has=re=>re.test(prompt);
  const night=has(/밤|달|별|우주|은하|새벽/)||style==='night';
  const sea=has(/바다|섬|파도|항해|표류|배/),forest=has(/숲|나무|오렌지|정원|잎/),flower=has(/꽃|장미|봄/),fire=has(/불|모닥|봉화|횃불/),rain=has(/비|눈물|슬픔/),heart=has(/마음|사랑|우정|배려/),bird=has(/새|날개|알|하늘/),planet=has(/행성|왕자|우주|별/);
  let pal=night?['#10123a','#2d2f7a','#ffeaa0']:sea?['#bff0ff','#4aa3d8','#fff3b0']:forest?['#e3f7c9','#8fd18a','#ffd166']:flower?['#ffe4ef','#ff9fb8','#fff3b0']:['#ffeedd','#ffb4a2','#fff3b0'];
  if(style==='water'){c.filter='blur(0.5px)'}
  const g=c.createLinearGradient(0,0,0,800);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);c.fillStyle=g;c.fillRect(0,0,600,800);
  const out_=style==='fairy'?'#3b3226':null;
  const shape=(fn,fill)=>{c.beginPath();fn();c.fillStyle=fill;c.fill();if(out_){c.lineWidth=5;c.strokeStyle=out_;c.stroke()}};
  // 별/구름
  if(night){for(let i=0;i<70;i++){c.fillStyle=`rgba(255,255,220,${0.4+r()*0.6})`;const s=1+r()*3;c.fillRect(r()*600,r()*480,s,s)}}
  else{for(let i=0;i<4;i++){const x=r()*500+50,y=100+r()*220;c.fillStyle='rgba(255,255,255,.9)';[[0,0,50],[45,10,38],[-45,12,34]].forEach(([dx,dy,rr])=>shape(()=>c.arc(x+dx,y+dy,rr,0,7),'rgba(255,255,255,.92)'))}}
  // 해/달
  shape(()=>c.arc(430,230,night?60:70,0,7),night?'#fff4c4':pal[2]);
  if(night)shape(()=>c.arc(455,215,52,0,7),pal[0]);
  if(planet){shape(()=>c.arc(150,330,55,0,7),'#ff9fb8');c.save();c.translate(150,330);c.rotate(-0.4);c.strokeStyle='#ffe29a';c.lineWidth=8;c.beginPath();c.ellipse(0,0,95,18,0,0,7);c.stroke();c.restore()}
  if(bird){for(let i=0;i<3;i++){const x=120+i*110,y=160+r()*80;c.strokeStyle=night?'#fff':'#3b3226';c.lineWidth=5;c.beginPath();c.moveTo(x-30,y);c.quadraticCurveTo(x-15,y-25,x,y);c.quadraticCurveTo(x+15,y-25,x+30,y);c.stroke()}}
  // 지형
  const groundCol=sea?'#4aa3d8':forest?'#5fb36a':'#b7e08c';
  shape(()=>{c.moveTo(0,560);c.quadraticCurveTo(150,500,300,560);c.quadraticCurveTo(450,610,600,540);c.lineTo(600,800);c.lineTo(0,800);c.closePath()},night?shade(groundCol,-70):groundCol);
  if(sea){for(let k=0;k<5;k++){c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=5;c.beginPath();for(let x=0;x<=600;x+=10)c.lineTo(x,600+k*38+Math.sin(x/38+k+r())*8);c.stroke()}
    shape(()=>c.ellipse(300,585,130,35,0,0,7),'#f3e2b3');cyl2(c,300,585);}
  if(forest||!sea){const n=forest?7:3;for(let i=0;i<n;i++){const x=40+r()*520,y=540+r()*40,s=0.8+r()*0.8;shape(()=>c.rect(x-8*s,y-70*s,16*s,80*s),'#8b5e3c');shape(()=>c.arc(x,y-100*s,55*s,0,7),night?'#2f6b4f':'#5fb36a');if(has(/오렌지|라임/))shape(()=>c.arc(x+20*s,y-90*s,10*s,0,7),'#ff9f1c')}}
  if(flower){for(let i=0;i<14;i++){const x=r()*600,y=640+r()*140;shape(()=>c.arc(x,y,12,0,7),rndPickR(['#ff8fab','#ffd166','#fff','#c9a7ff'],r))}}
  if(fire){const x=300,y=700;shape(()=>{c.moveTo(x-45,y+20);c.quadraticCurveTo(x-60,y-50,x,y-110);c.quadraticCurveTo(x+60,y-50,x+45,y+20);c.closePath()},'#ff7b3a');shape(()=>{c.moveTo(x-22,y+20);c.quadraticCurveTo(x-30,y-20,x,y-60);c.quadraticCurveTo(x+30,y-20,x+22,y+20);c.closePath()},'#ffd166')}
  if(heart){for(let i=0;i<6;i++){const x=80+r()*440,y=330+r()*180,s=14+r()*14;shape(()=>{c.moveTo(x,y+s*0.5);c.bezierCurveTo(x-s*2,y-s,x-s*0.5,y-s*1.8,x,y-s*0.6);c.bezierCurveTo(x+s*0.5,y-s*1.8,x+s*2,y-s,x,y+s*0.5)},'#ff6b8b')}}
  if(rain){c.strokeStyle='rgba(120,170,230,.7)';c.lineWidth=3;for(let i=0;i<60;i++){const x=r()*600,y=r()*600;c.beginPath();c.moveTo(x,y);c.lineTo(x-8,y+24);c.stroke()}}
  if(style==='water'){c.filter='none';for(let i=0;i<24;i++){c.fillStyle=`hsla(${r()*360},70%,75%,.12)`;c.beginPath();c.arc(r()*600,r()*800,40+r()*90,0,7);c.fill()}}
  // 합성
  out.imageSmoothingEnabled=!px;out.drawImage(a,0,0,W,H);
  // 필름 질감
  if(style==='water'||style==='fairy'){out.globalAlpha=.06;for(let i=0;i<900;i++){out.fillStyle=r()>.5?'#000':'#fff';out.fillRect(r()*W,r()*H,2,2)}out.globalAlpha=1}
  // 타이틀
  out.fillStyle='rgba(255,250,240,.92)';out.beginPath();out.roundRect(40,40,520,150,22);out.fill();out.lineWidth=4;out.strokeStyle='#3b3226';out.stroke();
  out.fillStyle='#3b3226';out.textAlign='center';out.textBaseline='middle';
  let fs=56;out.font=`${fs}px Jua, 'Gowun Dodum', sans-serif`;while(out.measureText(title).width>470&&fs>26){fs-=2;out.font=`${fs}px Jua, 'Gowun Dodum', sans-serif`}
  out.fillText(title,300,100);out.font="26px 'Gowun Dodum', sans-serif";out.fillText(author,300,158);
  out.fillStyle='rgba(59,50,38,.78)';out.beginPath();out.roundRect(120,730,360,44,22);out.fill();out.fillStyle='#fff';out.font="22px 'Gowun Dodum', sans-serif";
  out.fillText(`표지 · ${S.avatar.displayName||'나'}`,300,753);
}
function cyl2(c,x,y){c.fillStyle='#8b5e3c';c.fillRect(x-6,y-90,12,90);c.fillStyle='#5fb36a';for(let i=0;i<5;i++){c.beginPath();c.ellipse(x+Math.cos(i*1.26)*38,y-90+Math.sin(i*1.26)*14,40,10,i*1.26,0,7);c.fill()}}
function rndPickR(a,r){return a[Math.floor(r()*a.length)]}
function shade(hex,amt){return shadeC(hex,amt)}

let actx=null;const FREQ=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],PK=['a','s','d','f','g','h','j','k'];
function tone(f){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.4,actx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+1.1);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+1.2)}catch(e){}}
let pianoUI=false;
function openPiano(){
  const m=openModal(`<h2>🎹 음악실 피아노</h2><p class="mut">건반을 누르거나 키보드 A S D F G H J K (또는 1~8)를 눌러 연주해요.</p><div class="center" id="pk"></div><p class="mut center">책 속 장면의 분위기를 소리로 표현해 보세요 🎶</p>`,{onClose:()=>{pianoUI=false}});pianoUI=true;
  m.querySelector('#pk').innerHTML=FREQ.map((f,i)=>`<div class="key" data-i="${i}"><span>${['도','레','미','파','솔','라','시','도'][i]}<br>${PK[i].toUpperCase()}</span></div>`).join('');
  m.querySelectorAll('.key').forEach(k=>k.addEventListener('pointerdown',()=>{k.classList.add('down');tone(FREQ[+k.dataset.i]);setTimeout(()=>k.classList.remove('down'),160)}));
}
function pianoKey(k,down){if(!pianoUI||!down)return;let i=PK.indexOf(k);if(i<0&&/^[1-8]$/.test(k))i=+k-1;if(i<0)return;tone(FREQ[i]);const el=document.querySelectorAll('.key')[i];if(el){el.classList.add('down');setTimeout(()=>el.classList.remove('down'),160)}}

  function wire(){
    $('#nm').oninput=e=>{A.displayName=e.target.value;player.label.material.map.dispose&&0;rebuildPlayer()};
    $('#rnd').onclick=()=>{Object.assign(A,randomAvatar($('#nm').value));showCreatorKeep()};
    $('#ok').onclick=()=>{A.displayName=($('#nm').value||'').trim()||'새싹';save();screen.innerHTML='';startGame()};
  }
  rebind();wire();
}
async function startGame(){
  screen.innerHTML='';S.avatar.displayName=S.avatar.displayName||'새싹';rebuildPlayer();
  $('#hud').style.display='';$('#topbtns').style.display='flex';$('#helpbar').style.display='';
  await goScene('campus');
}
$('#b-books').onclick=()=>{if(uiLock===0)openMyBooks()};
$('#b-league').onclick=()=>{if(uiLock===0)openLeague()};
$('#b-avatar').onclick=()=>{if(uiLock>0||!cur||cur.creator)return;const keep=cur.name,pos=player.group.position.clone();
  S.avatar.displayName=S.avatar.displayName;goScene('creator').then(()=>{$('#hud').style.display='none';$('#topbtns').style.display='none';$('#helpbar').style.display='none';buildCreatorReturn(keep,pos)})};
function buildCreatorReturn(keep,pos){
  showCreatorFromGame(keep);
}
async function showCreatorFromGame(keep){
  // 같은 UI 재사용: 시작 버튼 라벨/동작만 다름
  await showCreatorUI();
  $('#ok').textContent='저장하고 돌아가기';
  $('#ok').onclick=async()=>{S.avatar.displayName=($('#nm').value||'').trim()||'새싹';save();screen.innerHTML='';rebuildPlayer();$('#hud').style.display='';$('#topbtns').style.display='flex';$('#helpbar').style.display='';await goScene(keep==='creator'?'campus':keep)};
}
async function showCreatorUI(){ // 현재 씬이 creator 인 상태에서 패널만 다시 그림
  const A=S.avatar;
  const sw=(key,arr)=>`<div class="row">${arr.map(c=>`<button class="swatch ${A[key]===c?'on':''}" data-k="${key}" data-v="${c}" style="background:${c}"></button>`).join('')}</div>`;
  const op=(key,arr)=>`<div class="row">${arr.map(v=>`<button class="opt ${A[key]===v?'on':''}" data-k="${key}" data-v="${v}">${L[v]}</button>`).join('')}</div>`;
  const render=(scroll=0)=>{
    screen.innerHTML=`<div class="creator"><h2 style="margin:0 0 6px">내 캐릭터 꾸미기</h2>
   <input type="text" id="nm" maxlength="8" placeholder="이름 (최대 8자)" value="${A.displayName}">
   <h3>피부색</h3>${sw('skin',SKINS)}<h3>머리 색</h3>${sw('hair',HAIRS)}<h3>머리 모양</h3>${op('hairStyle',HAIR_STYLES)}
   <h3>옷 색</h3>${sw('top',CLOTHES)}<h3>옷 종류</h3>${op('topStyle',TOP_STYLES)}<h3>바지/치마 색</h3>${sw('bottom',CLOTHES)}${op('bottomStyle',BOTTOM_STYLES)}
   <h3>표정</h3>${op('face',FACES)}<h3>눈</h3>${op('eyes',EYES)}<h3>액세서리</h3>${op('accessory',ACCS)}
   <div class="row" style="margin-top:16px"><button class="btn alt" id="rnd">🎲 랜덤</button><button class="btn" id="ok">저장</button></div></div>`;
    screen.querySelector('.creator').scrollTop=scroll;
    screen.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const sc=screen.querySelector('.creator').scrollTop;A.displayName=$('#nm').value;A[b.dataset.k]=b.dataset.v;rebuildPlayer();render(sc)});
    $('#nm').oninput=e=>{A.displayName=e.target.value;rebuildPlayer()};
    $('#rnd').onclick=()=>{Object.assign(A,randomAvatar($('#nm').value));rebuildPlayer();render(0)};
  };
  render();
}

/* ===== 시작 ===== */
showTitle();
loop();
// 디버그/테스트용 훅
window.__game={get S(){return S},get cur(){return cur},player,goScene,save,say,openModal,SCENES};
</script>
</body>
